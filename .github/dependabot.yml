# Dependabot opens a PR when a Python package (uv.lock) or a GitHub Action this repo uses has a
# newer version. Monthly, to keep the number of update PRs small; each is reviewed like any PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
