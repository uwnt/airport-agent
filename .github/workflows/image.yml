# Image: build the Docker image, start it and check /health reports this commit, check no secret
# files are inside, then build it for amd64 and arm64. On a v* tag, publish it to GitHub's
# container registry. Separate from ci.yml so `ci` stays one job. Not run on pull requests (each
# run is billed minutes, and `ci` already tests every PR): it runs on pushes to stg and prod,
# where a release needs the image, and on v* tags. Start it by hand on any branch with
# workflow_dispatch to check an image change before release.
name: Image

on:
  push:
    branches: [stg, prod]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  # A newer push to the same branch makes the older run pointless.
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  TEST_TAG: airport-agent:local # the image name docker-compose.yml uses

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4 # emulates arm64 for the multi-arch build
      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64, loaded for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Start it the way a reviewer does, through docker-compose.yml (using the image just built),
      # so the compose file, its localhost port and the HEALTHCHECK are tested too.
      # TALK_MODE and a placeholder key (no step here calls the model) check that compose passes
      # Talk mode's switch through: /info reports `talk` only with both set.
      - name: Start with compose and wait until healthy
        env:
          TALK_MODE: "on"
          GEMINI_API_KEY: placeholder-not-a-key
        run: |
          if ! docker compose up -d --no-build --wait --wait-timeout 60; then
            docker compose logs
            echo "::error::the container did not become healthy within 60 s"
            exit 1
          fi

      - name: /health reports this commit
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          body="$(curl -fsS http://127.0.0.1:8000/health)"
          echo "$body"
          commit="$(echo "$body" | jq -r .commit)"
          if [ "$commit" != "$EXPECTED" ]; then
            echo "::error::/health commit is '$commit', expected '$EXPECTED'"
            exit 1
          fi
          if [ "$(echo "$body" | jq -r .data_version)" = "null" ]; then
            echo "::error::/health reports no data snapshot"
            exit 1
          fi

      - name: Talk mode is on when started with TALK_MODE=on
        run: |
          talk="$(curl -fsS http://127.0.0.1:8000/info | jq -r .talk)"
          if [ "$talk" != "true" ]; then
            echo "::error::/info talk is '$talk' with TALK_MODE=on; docker-compose.yml must pass it"
            exit 1
          fi

      # /health reads no airport data: load every airport's signals once, so a data file the
      # image is missing fails here, not on the site. Plain `docker run`, not compose: compose
      # mounts the checkout's data/ over the image's, which would hide a missing COPY.
      - name: Every airport's signals load from the image alone
        run: >-
          docker run --rm --entrypoint python "$TEST_TAG" -c
          "from airport_agent.data.metrics import all_airport_metrics as a; print(len(a()), 'airports')"

      # The second command of the image; --help needs no network or credentials.
      - name: refresh command runs
        run: docker compose run --rm refresh --help

      # Scans the app's own files and the user's home, not third-party packages: libraries ship
      # public files such as certifi's cacert.pem that would otherwise trip the check.
      - name: No secret files in the image
        run: |
          found="$(docker run --rm --entrypoint sh "$TEST_TAG" -c \
            "find /app /home -xdev -path /app/.venv -prune -o \( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name 'id_rsa*' -o -name 'credentials*.json' \) -print;
             find /app/.venv/lib/python*/site-packages/airport_agent \( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name 'id_rsa*' -o -name 'credentials*.json' \) -print")"
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::secret-like files found in the image"
            exit 1
          fi
          echo "none found"

      - name: Stop the test container
        if: always()
        run: docker compose down || true

      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # Publishing gets its own job so only it holds the registry write permission. Its actions are
  # pinned to exact commits, since they run with that permission.
  publish:
    name: publish
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release check below needs the prod branch's history
          persist-credentials: false

      # Publish only a commit already released to prod (reviewed, approved, promoted), so a stray
      # tag on an unreleased commit can't put that code on the registry.
      - name: The tagged commit is on prod
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/prod; then
            echo "::error::tag $GITHUB_REF_NAME is not on prod; tag a released commit"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
