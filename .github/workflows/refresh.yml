# Refresh: build a new data snapshot on GitHub's machine and publish it as a data release
# (`data-YYYY-MM-DD`, then `-2`, `-3` for a second run that day). Data versions are released apart
# from code versions: running servers download the newest data release (data/releases.py), so new
# data reaches them without a new image, and bad data rolls back by deleting its release (and,
# where a server keeps installed files, its installed folder: docs/DATA_SOURCES.md).
# Started weekly, by hand, or by the app's Data panel (through the API, with a maintainer token).
#
# Two jobs, so only the second holds a write permission:
# - build (read-only): `airport-agent refresh`, the snapshot checks, and a comparison with the
#   previous data release (sources' as-of dates, the national top 10) as the release text;
# - publish: creates the release from the build job's files with the gh command line, so no
#   third-party action runs with the write permission.
# OpenSky credentials are optional: without the OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET
# repository secrets the refresh uses the committed OpenSky sample and says so in the manifest.
name: Refresh data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (off the hour, when GitHub's scheduler is busiest)

concurrency:
  group: data-refresh
  cancel-in-progress: false # one run at a time; never stop a run halfway

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install
        run: uv sync --locked

      # Per-month summaries from earlier runs, so months already summarised aren't downloaded again.
      # GitHub scopes caches by branch: a run on the default branch restores only caches saved
      # on the default branch, so a cache written by a run on another branch never reaches a
      # published release, and such a run can't publish anyway (the publish job's `if`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache
          key: refresh-cache-${{ github.run_id }}
          restore-keys: refresh-cache-

      - name: Refresh (download, transform)
        env:
          DATA_STORE: file://${{ runner.temp }}/out # an empty store: the version is today's
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: uv run airport-agent refresh

      - name: Validate, compare and package
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/out"
          version="$(ls "$out")"
          if [ "$(echo "$version" | wc -l)" != 1 ] || [ -z "$version" ]; then
            echo "::error::expected one snapshot in $out, found: $version"
            exit 1
          fi
          snapshot="$out/$version"
          uv run python -m airport_agent.data.releases check "$snapshot"
          # Who built it, shown by the app's Data panel; the app adds the release tag on download.
          jq -n --argjson run "$GITHUB_RUN_NUMBER" --arg url "$RUN_URL" --arg commit "$GITHUB_SHA" \
            '{run_number: $run, run_url: $url, commit: $commit}' > "$snapshot/release.json"
          # The previous data release, or the snapshot committed in the code when there is none.
          mkdir -p "$RUNNER_TEMP/previous" dist
          previous="$(uv run python -m airport_agent.data.releases previous "$RUNNER_TEMP/previous" "$REPO")"
          uv run python -m airport_agent.data.releases notes "$snapshot" "$previous" > dist/notes.md
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"
          tar -czf dist/snapshot.tar.gz -C "$out" "$version"
          cp "$snapshot/manifest.json" dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    # Only a run of the default branch publishes: a run started on another branch builds and
    # checks the snapshot but releases nothing.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and its tag
      actions: read # download the build job's files
    steps:
      - name: Download the built snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name data-release --dir dist

      # --latest=false: a data release never becomes the repository's "latest release", which
      # stays the newest code release.
      - name: Publish the data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(date -u +%F)"
          tag="data-$day"
          n=1
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            n=$((n + 1))
            tag="data-$day-$n"
          done
          gh release create "$tag" dist/snapshot.tar.gz dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Data $tag" \
            --notes-file dist/notes.md --latest=false
          echo "Published $tag" | tee -a "$GITHUB_STEP_SUMMARY"
