# Fly.io app: the same image as the Dockerfile, built remotely by the Deploy workflow
# (.github/workflows/deploy.yml), which passes RELEASE_SHA so /health reports the deployed commit.
# Runtime secrets (GEMINI_API_KEY) are Fly secrets, copied from the secrets manager by the Deploy
# workflow; they are never in this file. See the README, "Deploy (Fly)".
app = "airport-agent" # change here if the name is taken on Fly
primary_region = "iad" # US East, near the US data's users

[build]
  dockerfile = "Dockerfile"

[env]
  # The site is public: cap the questions sent to the model per UTC day, so one runaway client
  # cannot run up the bill. The count is in memory, so it starts again when the machine stops or
  # restarts; the Deploy workflow runs one machine (--ha=false), so this is the total, not per machine.
  MAX_MODEL_QUESTIONS_PER_DAY = "300"

[http_service]
  internal_port = 8000 # the port the Dockerfile's uvicorn listens on
  force_https = true
  # Sleeps when idle and wakes on the next visit (the first answer then takes a few seconds).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
