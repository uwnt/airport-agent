# Fly.io app: the same image as the Dockerfile, built remotely by the Deploy workflow
# (.github/workflows/deploy.yml), which passes RELEASE_SHA so /health reports the deployed commit.
# Runtime secrets (GEMINI_API_KEY, ACCESS_CODE) are Fly secrets, set from the secrets manager;
# they are never in this file. See the README, "Deploy (Fly)".
app = "airport-agent" # change here if the name is taken on Fly
primary_region = "iad" # US East, near the US data's users

[build]
  dockerfile = "Dockerfile"

[env]
  # Free questions need the access code (ACCESS_CODE, a secret); this caps model questions per
  # UTC day as a second guard. The count is in memory, so it restarts with the machine.
  MAX_MODEL_QUESTIONS_PER_DAY = "200"

[http_service]
  internal_port = 8000 # the port the Dockerfile's uvicorn listens on
  force_https = true
  # Sleeps when idle and wakes on the next visit (the first answer then takes a few seconds).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
