# Runway capacity in good and bad weather, for 30 US airports.
# Source: FAA, "Airport Capacity Profiles" (2014), page 9, "Table 1. Capacity Rate Ranges for
# Current Operations at the Core Airports".
# https://www.faa.gov/sites/faa.gov/files/airports/planning_capacity/profiles/Airport-Capacity-Profiles-2014.pdf
# Transcribed by hand; aircraft operations (arrivals and departures) per hour.
# Per airport: `visual`, `marginal` and `instrument` weather, each a list of [low, high] ranges
# (a single number N is [N, N]). Where the table has an Arrival Priority (AP) row and a
# Departure Priority (DP) row, both ranges are listed. `note` is for anything not used.
# Shown only, never scored (D27): see docs/DATA_SOURCES.md.

